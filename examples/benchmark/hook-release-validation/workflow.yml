name: Hook application and Swagger validation

on:
  workflow_dispatch:
    inputs:
      package:
        description: Compatibility with the existing dispatch entry point
        default: '@fastify/swagger'
        type: string
      node-version:
        description: Node version
        default: '24'
        type: choice
        options: ['24']
      os:
        description: Operating system
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest]

permissions:
  contents: read

jobs:
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/checkout@v6
        with:
          ref: 8b9c07b645a8156c23a1d2619267fc84ea879250
          path: baseline-source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: c727fe8b158558332ab49bbca5c337797a57f433
          path: candidate-source
          persist-credentials: false
      - name: Install isolated applications with matching dependency locks
        run: node harness/examples/benchmark/hook-release-validation/prepare.js results baseline-source candidate-source
      - name: Baseline application, warning policies, and traffic
        run: node harness/examples/benchmark/hook-release-validation/run.js results/baseline baseline results/baseline.json 20 3
      - name: Candidate application, warning policies, and traffic
        if: ${{ !cancelled() }}
        run: node harness/examples/benchmark/hook-release-validation/run.js results/candidate candidate results/candidate.json 20 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-results
          path: |
            results/*.json
            results/baseline/package-lock.json
            results/candidate/package-lock.json

  swagger:
    name: Swagger with explicit QUERY test setup (${{ matrix.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: baseline
            ref: 8b9c07b645a8156c23a1d2619267fc84ea879250
          - role: candidate
            ref: c727fe8b158558332ab49bbca5c337797a57f433
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          path: fastify
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: fastify/fastify-swagger
          ref: f3ecd6365bd39da545b1537daa5b1956a09368ce
          path: swagger
          persist-credentials: false
      - name: Register QUERY explicitly in its test fixture
        working-directory: swagger
        run: git apply ../harness/docs/Design/swagger-query-compatibility.patch
      - name: Install tested Fastify tarball into Swagger
        run: |
          cd fastify
          npm pack --ignore-scripts --pack-destination ..
          cd ../swagger
          npm install --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts ../fastify-5.8.5.tgz
          node -e "console.log('Fastify under test:', require('fastify/package.json').version)"
      - name: Lint, complete runtime suite, coverage, and TypeScript
        working-directory: swagger
        run: |
          npm run lint
          npm test
